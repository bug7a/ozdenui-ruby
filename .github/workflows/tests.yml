# Every push: the tests (with a real page in a hidden browser), then a picture of every example, light and dark,
# on macOS, Windows and Linux, with the oldest Ruby the gem takes, the last of 3 and the newest (4.0 removed
# parts of the standard library that 3.4 still had).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        ruby: ["2.6", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: The kit copy and kit.json agree
        shell: bash
        run: |
          ruby tools/gen.rb
          git diff --exit-code lib/ozdenui/kit.json lib/ozdenui/COMPONENTS.md
      # WHY a second try of all the tests: test_window plays a page in a hidden browser, and on a busy CI computer it
      #     sometimes ran out of time (2026-11-26: twice in a day, each time a different step); a real fault fails twice.
      #     The whole file again, not test_window alone: a fault of another test must not pass on the second try.
      - name: The tests
        shell: bash
        run: ruby test/ozdenui_test.rb || { echo "again: the tests once more"; ruby test/ozdenui_test.rb; }
      - name: The gem is built
        run: gem build ozdenui.gemspec
      - name: Every example in a hidden browser
        shell: bash
        run: checks/look-all.sh pictures
      - name: The pictures of the windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ matrix.os }}-${{ matrix.ruby }}
          path: pictures
          if-no-files-found: ignore
