                <h1>Modern desktop windows, in&nbsp;plain Ruby</h1>
                <p>Write the window in Ruby: boxes, texts, buttons and ready components appear in a small window of its own. Only Ruby: no JavaScript, no HTML, no CSS, no front-end build, no other gem and no compiler.</p>
                <p>v0.1.4 · experimental · Ruby 2.6+ · tested on macOS and Windows · 83 components, each a method · basic.js inside: about 3.4 MB, no internet · no other gem, no compiler · Apache 2.0</p>
                <p><code>gem install ozdenui</code></p>
                <h2>A counter in a few lines</h2>
                <p>Groups place the objects for you, and a lambda given to a button runs when it is clicked.</p>
                <ul>
                    <li><b>A group is a block.</b> The objects made in the block of a group go into it: the shape of the code is the shape of the window.</li>
                    <li><b>Values in Ruby.</b> @label.text = "1" changes the window; field.text and box.checked? are read in Ruby, with no question to the window.</li>
                    <li><b>One thread, no locks.</b> The block of run, an event and a timer run one at a time. The changes of a task go to the window together, when it ends.</li>
                </ul>
                <h2>Only Ruby, nothing to build</h2>
                <ul>
                    <li><b>No other gem, no compiler.</b> gem install ozdenui and nothing else: no native extension to build, no Node, no npm. basic.js and its components are inside the gem (about 3.4 MB) and are served only to this computer: no internet.</li>
                    <li><b>The Ruby you already have.</b> Ruby 2.6 or newer, also the Ruby that comes with macOS. On macOS the window is the web view of the system, called through fiddle; on Windows and Linux it is an app window of Edge or Chrome.</li>
                    <li><b>Code that reads like the window.</b> Groups are blocks, the names are those of basic.js in snake_case, events are lambdas, methods or blocks. A wrong name is told in the terminal with the line of your program and the name you meant.</li>
                    <li><b>Threads welcome.</b> A slow job runs in a Thread of its own and the window does not wait. ui { } brings its result back to the objects.</li>
                </ul>
                <h2>Ready components, called from Ruby</h2>
                <p>SmartButton, TextField, EmailField, PasswordField, NumberField, UrlField, PhoneField, CurrencyField, TextAreaField, SearchInput, TagInput, CheckBox, Toggle, RadioButton, SelectBox, Slider, RangeSlider, SliderField, Stepper, DatePicker, TimePicker, ColorPicker, FilePicker, ProgressBar, StepBar, ItemList, SortableList, SmartTable, DataTable, TreeView, Tabs, Accordion, GridGroup, ScrollArea, Splitter, SidePanel, GraphBox, Gauge, LogView, ImageView, MarkdownView, JsonView, JsonEditor, CodeEditor, Canvas, ChatView, WebView, MenuBar, ToolBar, StatusBar, ContextMenu, Tooltip and the others of the 83. Each one is a method of its name, with the params of the kit in snake_case; component("Gauge", ...) makes any of them by its name.</p>
                <h2>A component of your own, in plain Ruby</h2>
                <p>A class that makes its objects in a group is a component: use it again and again, change it with its methods, share it as a file or a gem. No JavaScript is needed.</p>
                <h2>A dialog that returns its answer</h2>
                <p>confirm waits for the answer and returns it, like a question in a terminal. The window keeps working meanwhile: timers run and the page is drawn.</p>
                <h2>Twenty-one small programs</h2>
                <p>A small code editor, A small Markdown editor, A small JSON viewer, CSV viewer, A chat, Charts, Image viewer, A job and its log, A form, Settings, To do, Notes, Dialogs, Gallery, The minimal look, Calculator, The basic objects, Counter, Greeting, Clock and Catch the dots, in the examples folder of the repository.</p>
                <h2>Where it fits</h2>
                <p>A good choice for a script or a command line tool that needs a window, for a tool given to your team as one Ruby file, and for a modern look without HTML, CSS or a front-end build. For more than one window (v0.1.4 has one window for a program), a program given as an app of its own, a large desktop application with the widgets of the system (Ruby/GTK) or a web application for many users (Rails or Sinatra), something else is better.</p>
                <h2>Three steps</h2>
                <ol>
                    <li><b>Install it.</b> gem install ozdenui: one gem, with no other gem behind it and nothing to compile. On macOS the Ruby of the system is enough.</li>
                    <li><b>Write the block of run.</b> Make the objects of the window in it. Groups place them; a lambda or a method runs on a click.</li>
                    <li><b>Run it.</b> ruby hello.rb opens a window; run returns when it is closed.</li>
                </ol>
                <p><a href="handbook/" style="color: inherit;">The handbook</a>: from the first window to a component of your own, in English and Turkish.</p>
                <p>Ruby 2.6+. Tested on macOS and Windows 11. On macOS the window is the web view of the system (WKWebView); on Windows and Linux it is an app window of Edge or Chrome. Linux is checked by the tests of the repository, not yet by hand.</p>
